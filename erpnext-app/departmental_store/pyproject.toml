[project]
name = "departmental_store"
authors = [
    { name = "Sukesh Periyasamy", email = "sukeshperiyasamy@users.noreply.github.com" },
]
description = "Departmental store customizations: offline POS sync, idempotent sale submission, device registration"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
