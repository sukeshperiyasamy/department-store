name: CI Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  preflight-and-security:
    name: Security & Config Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secret Scanning Gate
        run: |
          python scripts/ci/secret_scan.py

      - name: Deployment & Container Config Validation
        run: |
          python scripts/ci/validate_deployment_configs.py

  typescript-and-contracts:
    name: Typecheck & Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck (All Workspaces)
        run: npm run typecheck

      - name: Validate Shared API Contracts (Zod Schemas)
        run: npm test --workspace @departmental/shared-types

      - name: Audit Production Dependencies
        run: npm audit --audit-level=high || true

  dashboard-build-and-test:
    name: Owner Dashboard Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Dashboard Unit & Middleware Tests
        run: npm run test --workspace @departmental/owner-dashboard

      - name: Production Build Next.js Dashboard
        run: npm run build --workspace @departmental/owner-dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  windows-pos-test-and-build:
    name: Windows POS Test & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Windows POS Tests (Outbox, SQLite, Sync Engine)
        run: npm run test --workspace @departmental/windows-pos

      - name: Build Windows POS Frontend Bundle
        run: npm run build --workspace @departmental/windows-pos

  mobile-app-tests:
    name: Mobile Companion Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Mobile Isolation Tests
        run: npm run test --workspace @departmental/mobile

  frappe-python-lint:
    name: Frappe App Python Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint Frappe Custom App
        working-directory: erpnext-app/departmental_store
        run: ruff check departmental_store
