# ==============================================================================
# Docker Compose for Traefik v3 Edge Ingress
# Department Store ERP — Multi-Tenant SaaS Platform
# ==============================================================================
# Usage:
#   docker compose -f deployment/ingress/docker-compose.traefik.yml --env-file deployment/ingress/.env up -d
# ==============================================================================

services:
  traefik:
    image: traefik:v3.2
    container_name: saas-edge-ingress
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Public HTTP (Port 80) — Redirects to HTTPS
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      # Public HTTPS (Port 443) — TLS Termination
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    environment:
      # Base Domain & ACME Email
      - BASE_DOMAIN=${BASE_DOMAIN:-departmentstore.in}
      - ACME_EMAIL=${ACME_EMAIL:-admin@departmentstore.in}
      # DNS-01 Challenge Credentials (Provider-specific)
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_HOSTED_ZONE_ID=${AWS_HOSTED_ZONE_ID:-}
      - DO_AUTH_TOKEN=${DO_AUTH_TOKEN:-}
    volumes:
      # Read-only static & dynamic configuration
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      # Persistent ACME Certificate & State Storage (Restricted Permissions)
      - traefik-acme:/etc/traefik/acme
      # Docker socket for container discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frappe_network
      - ingress_network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  traefik-acme:
    name: saas-traefik-acme-data

networks:
  frappe_network:
    external: true
    name: departmental-erp_frappe_network
  ingress_network:
    name: saas-ingress-network
    driver: bridge
